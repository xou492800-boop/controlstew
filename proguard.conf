# ProGuard rules for XOSControlStew.
# Goal: keep the plugin loadable by Paper/Bukkit while obfuscating everything
# that reflection/the plugin loader doesn't need by its original name.

-dontwarn **
-ignorewarnings
-optimizationpasses 3
-allowaccessmodification
-mergeinterfacesaggressively
-overloadaggressively
-repackageclasses 'dev.xoscontrolstew.o'
-flattenpackagehierarchy
-adaptclassstrings
-adaptresourcefilecontents plugin.yml

# Strip debugging info so a decompiled class carries no line numbers,
# original variable names, or source file name.
-renamesourcefileattribute ""
-keepattributes !LocalVariableTable,!LocalVariableTypeTable,!SourceFile,!LineNumberTable

# The main class must keep its fully-qualified name: plugin.yml's "main:" line
# and Bukkit's class loader both look it up by exact string, and there is no
# other hook to redirect that lookup to an obfuscated name.
-keep class dev.xoscontrolstew.XOSControlStew {
    public <init>();
    public void onEnable();
    public void onDisable();
}

# Anything Bukkit calls back into via reflection (event handlers, the command
# executor) must keep its method signature so the server can still find it.
-keepclassmembers class * implements org.bukkit.event.Listener {
    @org.bukkit.event.EventHandler <methods>;
}
-keepclassmembers class * implements org.bukkit.command.CommandExecutor {
    public boolean onCommand(org.bukkit.command.CommandSender, org.bukkit.command.Command, java.lang.String, java.lang.String[]);
}

# Enum values() / valueOf() are looked up by name in a few places (GameMode,
# PotionEffectType, etc. are Paper's own classes and untouched; this guards
# any enum we declare ourselves, if one is ever added).
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
